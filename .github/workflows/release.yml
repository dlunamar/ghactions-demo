# ============================================================
# Release: empaqueta la app al etiquetar (tag v*) o manualmente.
# Equivalente en Azure DevOps: stage "Producción" con environment
# y approvers. La aprobación aquí se configura en
# Settings -> Environments -> production -> Required reviewers
# ============================================================
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:                      # lanzamiento manual (como Run pipeline)

permissions:
  contents: write                         # mínimo privilegio: solo crear la release

jobs:
  publish:
    name: Publicar artefacto
    runs-on: ubuntu-latest
    environment: production               # <- aquí viven las approvals y los secretos del entorno
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/GhActionsDemo.Core
          --configuration Release
          --output publish
          -p:Version=${GITHUB_REF_NAME#v}

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: GhActionsDemo-${{ github.ref_name }}
          path: publish/

      # El rollback es publicar de nuevo el tag anterior:
      # el artefacto de cada tag queda en la release, como las
      # revisiones de Container Apps.

      - name: Crear GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/**
          generate_release_notes: true
